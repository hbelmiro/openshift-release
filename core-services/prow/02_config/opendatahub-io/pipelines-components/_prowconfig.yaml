tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - opendatahub-io/pipelines-components
  merge_method:
    opendatahub-io/pipelines-components: squash
  merge_label: tide/merge
